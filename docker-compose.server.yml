services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: enterprise_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__Conn1=server=db;Port=3306;Database=enterprise_db;Uid=root;Pwd=pass;
      - ASPNETCORE_ENVIRONMENT=Production

volumes:
  mysql_data: